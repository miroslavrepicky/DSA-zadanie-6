<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>BDD diagram</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
         background: #f5f7fa; display: flex; flex-direction: column;
         align-items: center; padding: 24px 16px; min-height: 100vh; }
  h1   { font-size: 18px; font-weight: 600; color: #1a1a2e;
         margin-bottom: 6px; }
  .sub { font-size: 13px; color: #666; margin-bottom: 20px; }
  #canvas-wrap { background: #fff; border: 1px solid #dde3ee;
                 border-radius: 12px; overflow: auto;
                 box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  svg  { display: block; }
  .legend { display: flex; gap: 20px; margin-top: 16px;
            font-size: 12px; color: #555; align-items: center; }
  .leg-item { display: flex; align-items: center; gap: 6px; }
  .leg-dot  { width: 14px; height: 14px; border-radius: 3px;
              border: 1.5px solid #999; }
  .info { margin-top: 14px; font-size: 12px; color: #888; }
</style>
</head>
<body>
<h1>BDD diagram</h1>
<p class="sub">Poradie premenných: <strong>ABC</strong>  &nbsp;|&nbsp; Uzlov (bez terminálov): <strong>4</strong></p>
<div id="canvas-wrap"><svg id="svg"></svg></div>
<div class="legend">
  <div class="leg-item"><div class="leg-dot" style="background:#d0e8ff"></div> interný uzol</div>
  <div class="leg-item"><div class="leg-dot" style="background:#90ee90"></div> terminál 1</div>
  <div class="leg-item"><div class="leg-dot" style="background:#ff9999"></div> terminál 0</div>
  <div class="leg-item"><svg width="32" height="14"><line x1="0" y1="7" x2="32" y2="7" stroke="#333" stroke-width="1.5"/><polygon points="28,4 32,7 28,10" fill="#333"/></svg> hrana 1</div>
  <div class="leg-item"><svg width="32" height="14"><line x1="0" y1="7" x2="32" y2="7" stroke="#333" stroke-width="1.5" stroke-dasharray="4,3"/><polygon points="28,4 32,7 28,10" fill="#333"/></svg> hrana 0</div>
</div>
<p class="info">Plná hrana = premenná je 1 &nbsp;|&nbsp; Prerušovaná hrana = premenná je 0</p>

<script>
const NODES = [
  {id:0, label:"A", terminal:false, value:-1, high:1, low:2, isRoot:1},
  {id:1, label:"B", terminal:false, value:-1, high:3, low:4, isRoot:0},
  {id:2, label:"B", terminal:false, value:-1, high:4, low:5, isRoot:0},
  {id:3, label:"1", terminal:true, value:1, high:-1, low:-1, isRoot:0},
  {id:4, label:"C", terminal:false, value:-1, high:3, low:5, isRoot:0},
  {id:5, label:"0", terminal:true, value:0, high:-1, low:-1, isRoot:0}
];

/* ── Rozloženie do vrstiev (level = hĺbka v BFS) ── */
(function layout() {
  const N = NODES.length;

  /* priradíme vrstvu každému uzlu */
  const level = new Array(N).fill(-1);
  const root  = NODES.findIndex(n => n.isRoot);
  const queue = [root];
  level[root] = 0;
  while (queue.length) {
    const cur = queue.shift();
    const n   = NODES[cur];
    if (n.terminal) continue;
    for (const child of [n.high, n.low]) {
      if (child >= 0 && level[child] < 0) {
        level[child] = level[cur] + 1;
        queue.push(child);
      }
    }
  }
  /* terminály vždy na najnižšiu vrstvu */
  const maxLvl = Math.max(...level.filter(l => l >= 0));
  NODES.forEach((n, i) => { if (n.terminal) level[i] = maxLvl + 1; });

  /* zoskupíme podľa vrstiev */
  const layers = [];
  for (let i = 0; i <= maxLvl + 1; i++) layers.push([]);
  NODES.forEach((_, i) => { if (level[i] >= 0) layers[level[i]].push(i); });

  /* ── Geometria ── */
  const R_INT  = 26;   /* polomer interného uzla          */
  const R_TERM = 20;   /* polomer terminálu               */
  const HGAP   = 80;   /* horizontálna medzera medzi uzlami */
  const VGAP   = 100;  /* vertikálna medzera medzi vrstvami */
  const PAD    = 50;

  /* šírka vrstvy */
  const layerW = layers.map(l => {
    const r = l.some(i => !NODES[i].terminal) ? R_INT : R_TERM;
    return l.length * (2 * r) + (l.length - 1) * HGAP;
  });
  const totalW  = Math.max(...layerW) + 2 * PAD;
  const totalH  = (layers.length) * (2 * R_INT + VGAP) + PAD;

  /* súradnice uzlov */
  const x = new Array(N), y = new Array(N);
  layers.forEach((layer, li) => {
    const r  = layer.some(i => !NODES[i].terminal) ? R_INT : R_TERM;
    const lw = layerW[li];
    const ox = (totalW - lw) / 2;
    const cy = PAD + li * (2 * R_INT + VGAP) + r;
    layer.forEach((ni, pos) => {
      x[ni] = ox + pos * (2 * r + HGAP) + r;
      y[ni] = cy;
    });
  });

  /* ── SVG rendering ── */
  const svg = document.getElementById('svg');
  svg.setAttribute('width',  totalW);
  svg.setAttribute('height', totalH);
  svg.setAttribute('viewBox', `0 0 ${totalW} ${totalH}`);

  const ns = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, txt) {
    const e = document.createElementNS(ns, tag);
    Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k, v));
    if (txt !== undefined) e.textContent = txt;
    return e;
  }

  /* defs – markery pre hrany */
  const defs = el('defs', {});
  function arrowMarker(id, color, dash) {
    const m = el('marker', {id, viewBox:'0 0 10 10', refX:'9', refY:'5',
                 markerWidth:'7', markerHeight:'7', orient:'auto-start-reverse'});
    m.appendChild(el('path', {d:'M1 1L9 5L1 9', fill:'none',
                              stroke: color, 'stroke-width':'1.5',
                              'stroke-linecap':'round','stroke-linejoin':'round'}));
    return m;
  }
  defs.appendChild(arrowMarker('ah',  '#3a6ea5', false));
  defs.appendChild(arrowMarker('ahd', '#888',    true));
  svg.appendChild(defs);

  /* vrstva hrán (pod uzlami) */
  const edgeLayer = el('g', {});
  svg.appendChild(edgeLayer);
  /* vrstva uzlov */
  const nodeLayer = el('g', {});
  svg.appendChild(nodeLayer);

  /* hrany */
  NODES.forEach((n, i) => {
    if (n.terminal) return;
    [[n.high, true], [n.low, false]].forEach(([ci, isHigh]) => {
      if (ci < 0) return;
      const r1 = R_INT, r2 = NODES[ci].terminal ? R_TERM : R_INT;
      /* vypočíta bod na obvode uzla smerom k cieľu */
      const dx = x[ci] - x[i], dy = y[ci] - y[i];
      const dist = Math.sqrt(dx*dx + dy*dy) || 1;
      const sx = x[i]  + dx / dist * r1;
      const sy = y[i]  + dy / dist * r1;
      const ex = x[ci] - dx / dist * r2;
      const ey = y[ci] - dy / dist * r2;

      /* Bezier ohyb pre prehľadnosť ak sú uzly na rovnakej úrovni */
      let pathD;
      if (Math.abs(sy - ey) < 10) {
        const mx = (sx + ex) / 2, my = sy - 60;
        pathD = `M${sx},${sy} Q${mx},${my} ${ex},${ey}`;
      } else {
        pathD = `M${sx},${sy} L${ex},${ey}`;
      }

      const color  = isHigh ? '#3a6ea5' : '#888';
      const marker = isHigh ? 'url(#ah)' : 'url(#ahd)';
      const dash   = isHigh ? '' : '6,4';
      const p = el('path', {
        d: pathD, fill: 'none', stroke: color,
        'stroke-width': '1.6',
        'stroke-dasharray': dash,
        'marker-end': marker
      });
      edgeLayer.appendChild(p);

      /* label hrany – pri strede hrany */
      const lx = (sx + ex) / 2, ly = (sy + ey) / 2 - 6;
      const lt = el('text', {
        x: lx, y: ly, 'text-anchor':'middle',
        'font-size':'11', fill: color, 'font-weight':'600'
      }, isHigh ? '1' : '0');
      edgeLayer.appendChild(lt);
    });
  });

  /* uzly */
  NODES.forEach((n, i) => {
    const g   = el('g', {class:'bdd-node', style:'cursor:default'});
    const r   = n.terminal ? R_TERM : R_INT;
    const fill = n.terminal
                 ? (n.value ? '#90ee90' : '#ff9999')
                 : '#d0e8ff';
    const stroke = n.isRoot ? '#1a6fb5' : '#6699cc';
    const sw     = n.isRoot ? '2.5' : '1.5';

    if (n.terminal) {
      /* terminál = zaoblený štvorec */
      g.appendChild(el('rect', {
        x: x[i]-r, y: y[i]-r, width:2*r, height:2*r,
        rx:'6', fill, stroke, 'stroke-width': sw
      }));
    } else {
      g.appendChild(el('circle', {
        cx: x[i], cy: y[i], r,
        fill, stroke, 'stroke-width': sw
      }));
      if (n.isRoot) {
        /* dvojitý kruh pre koreň */
        g.appendChild(el('circle', {
          cx: x[i], cy: y[i], r: r - 5,
          fill:'none', stroke: '#1a6fb5', 'stroke-width':'1'
        }));
      }
    }

    g.appendChild(el('text', {
      x: x[i], y: y[i],
      'text-anchor':'middle', 'dominant-baseline':'central',
      'font-size': n.terminal ? '14' : '15',
      'font-weight':'600', fill:'#1a1a2e'
    }, n.label));

    nodeLayer.appendChild(g);
  });

  document.getElementById('canvas-wrap').style.maxWidth = totalW + 'px';
})();
</script>
</body>
</html>
